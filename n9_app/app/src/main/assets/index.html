
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>CRASH ANALYZER N9</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px;background:#101827;
 color:white;font-family:Arial,sans-serif
}
main{max-width:650px;margin:auto}
h1{text-align:center;color:#65b5ff;font-size:25px}
.subtitle{text-align:center;color:#aebdd0;font-size:12px}
.card{
 background:#202d40;padding:16px;margin:12px 0;
 border:1px solid #34465d;border-radius:13px
}
.grid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:10px
}
button{
 width:100%;padding:13px;margin:5px 0;
 border:0;border-radius:8px;background:#2385df;
 color:white;font-weight:bold
}
input{
 width:100%;padding:13px;margin:10px 0;
 border-radius:8px;border:1px solid #526780;
 background:#101827;color:white;font-size:16px
}
.small{color:#aebdd0;font-size:12px}
.stat{
 background:#101827;padding:12px;border-radius:8px;
 text-align:center
}
.stat strong{display:block;color:#65b5ff;font-size:19px}
#espaceBot[hidden],#accueil[hidden]{display:none}
.second{background:#475569}
.danger{background:#a33b48}
h2{color:#65b5ff;font-size:17px}
</style>
</head>
<body>
<main>

<h1>CRASH ANALYZER N9</h1>
<p class="subtitle">CENTRE DES 9 MODULES STATISTIQUES</p>

<div id="accueil">
 <div class="card">
  <h2>TABLEAU DE BORD</h2>
  <p class="small">Tes neuf espaces de suivi statistique</p>
  <div class="grid" id="bots"></div>
 </div>
</div>

<div class="card" id="espaceBot" hidden>
 <h2 id="nomBot"></h2>
 <p class="small">ESPACE DE SUIVI HISTORIQUE</p>

 <label>Ajouter une valeur historique</label>
 <input id="valeur" type="number"
 min="0.01" max="10000" step="0.01"
 placeholder="Exemple : 2.45">

 <button id="ajouter">ENREGISTRER</button>

 <h2>STATISTIQUES</h2>
 <div class="grid">
  <div class="stat">Total<strong id="total">0</strong></div>
  <div class="stat">Moyenne<strong id="moyenne">0</strong></div>
  <div class="stat">Minimum<strong id="minimum">0</strong></div>
  <div class="stat">Maximum<strong id="maximum">0</strong></div>
 </div>

 <h2>HISTORIQUE</h2>
 <div id="historique" class="small">
  Aucune donnée.
 </div>

 <button class="danger" id="effacer">EFFACER L'HISTORIQUE</button>
 <button class="second" id="retour">RETOUR AUX 9 MODULES</button>
</div>

<p class="subtitle">
Analyse descriptive des données passées.
Aucune garantie sur les résultats futurs.
</p>

</main>

<script>
const bots=[
"Module 1","Module 2","Module 3",
"Module 4","Module 5","Module 6",
"Module 7","Module 8","Module 9"
];

let actif=-1;

function lire(i){
 try{
  const nouvelle="n9_module_"+i;
  const ancienne="n9_bot_"+i;

  let donnees=localStorage.getItem(nouvelle);

  if(donnees===null){
   donnees=localStorage.getItem(ancienne);
   if(donnees!==null){
    const anciennes=JSON.parse(donnees);
    if(Array.isArray(anciennes)){
     localStorage.setItem(nouvelle,JSON.stringify(anciennes));
     return anciennes;
    }
   }
   return [];
  }

  const resultat=JSON.parse(donnees);
  return Array.isArray(resultat)?resultat:[];
 }catch(e){
  return [];
 }
}

function creerListe(){
 const zone=document.getElementById("bots");
 zone.innerHTML="";

 bots.forEach((nom,i)=>{
  const b=document.createElement("button");
  b.textContent=nom;
  b.onclick=()=>ouvrirBot(i);
  zone.appendChild(b);
 });
}

function ouvrirBot(i){
 actif=i;
 document.getElementById("accueil").hidden=true;
 document.getElementById("espaceBot").hidden=false;
 document.getElementById("nomBot").textContent=bots[i];
 afficher();
}

function afficher(){
 const d=lire(actif);
 const n=d.length;

 document.getElementById("total").textContent=n;
 document.getElementById("moyenne").textContent=
  n?(d.reduce((a,b)=>a+b,0)/n).toFixed(2):"0";
 document.getElementById("minimum").textContent=
  n?Math.min(...d).toFixed(2):"0";
 document.getElementById("maximum").textContent=
  n?Math.max(...d).toFixed(2):"0";

 const h=document.getElementById("historique");
 h.innerHTML="";

 if(!n){
  h.textContent="Aucune donnée enregistrée.";
  return;
 }

 d.slice().reverse().forEach((v,i)=>{
  const ligne=document.createElement("p");
  ligne.textContent=(i+1)+". "+v.toFixed(2);
  h.appendChild(ligne);
 });
}

document.getElementById("ajouter").onclick=()=>{
 const champ=document.getElementById("valeur");
 const v=Number(champ.value);

 if(!champ.value||!Number.isFinite(v)||v<=0||v>10000){
  alert("Valeur invalide.");
  return;
 }

 const d=lire(actif);
 d.push(v);
 localStorage.setItem(
  "n9_module_"+actif,JSON.stringify(d)
 );

 champ.value="";
 afficher();
};

document.getElementById("effacer").onclick=()=>{
 if(!confirm("Effacer tout cet historique ?"))return;
 localStorage.removeItem("n9_module_"+actif);
 afficher();
};

document.getElementById("retour").onclick=()=>{
 document.getElementById("espaceBot").hidden=true;
 document.getElementById("accueil").hidden=false;
 actif=-1;
};

creerListe();
</script>
</body>
</html>
