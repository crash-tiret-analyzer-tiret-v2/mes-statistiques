<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistiques</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101827">
<style>
body{font-family:Arial;background:#101827;color:white;padding:20px}
main{max-width:420px;margin:auto}
h1{color:#65b5ff}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:9px;box-sizing:border-box}
input{border:1px solid #607080;background:#202d40;color:white}
button{background:#2385df;color:white;border:0;font-weight:bold}
.resultat{background:#202d40;padding:15px;margin-top:12px;border-radius:10px}
</style>
</head>
<body>
<main>
<h1>Mes statistiques</h1>
<p>Calcul de tes notes sur 20</p>
<div id="notes">
<input type="number" min="0" max="20" step="0.25" placeholder="Note 1">
</div>
<button onclick="ajouter()">Ajouter une note</button>
<button onclick="calculer()">Calculer</button>
<div class="resultat" id="resultat">Tes résultats apparaîtront ici.</div>
</main>
<script>
function ajouter(){
const input=document.createElement("input");
input.type="number";
input.min="0";
input.max="20";
input.step="0.25";
input.placeholder="Nouvelle note";
document.getElementById("notes").appendChild(input);
}
function calculer(){
const champs=[...document.querySelectorAll("#notes input")];
const valeurs=champs.map(x=>x.value.trim()===""?NaN:Number(x.value));
if(valeurs.length===0||valeurs.some(x=>!Number.isFinite(x)||x<0||x>20)){
document.getElementById("resultat").textContent="Entre des notes valides entre 0 et 20.";
return;
}
const moyenne=valeurs.reduce((a,b)=>a+b,0)/valeurs.length;
document.getElementById("resultat").innerHTML=
"Nombre de notes : "+valeurs.length+
"<br>Moyenne : "+moyenne.toFixed(2)+"/20"+
"<br>Meilleure note : "+Math.max(...valeurs)+"/20"+
"<br>Note la plus basse : "+Math.min(...valeurs)+"/20";
}
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js");}</script>
</body>
</html>
