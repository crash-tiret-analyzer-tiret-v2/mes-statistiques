name: Construire APK N9

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire APK
        working-directory: n9_app
        run: gradle assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Crash-Analyzer-N9
          path: n9_app/app/build/outputs/apk/debug/*.apk

