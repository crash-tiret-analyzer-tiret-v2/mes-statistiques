<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>CRASH ANALYZER N9</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
padding:16px;
background:#101827;
color:white;
font-family:Arial,sans-serif
}
main{max-width:600px;margin:auto}
h1{text-align:center;color:#65b5ff}
h2{color:#65b5ff;font-size:18px}
.card{
background:#202d40;
padding:15px;
margin:12px 0;
border-radius:12px
}
button{
width:100%;
padding:13px;
margin:6px 0;
border:0;
border-radius:8px;
background:#2385df;
color:white;
font-weight:bold
}
.small{color:#aebdd0;font-size:12px}
</style>
</head>
<body>
<main>

<h1>CRASH ANALYZER N9</h1>
<p class="small" style="text-align:center">
CENTRE DES 9 MODULES STATISTIQUES
</p>

<div id="accueil">



</div>
<div class="card">
<h2>NEUF MODULES STATISTIQUES</h2>
<div id="bots"></div>
</div>

<div class="card" id="espaceBot" hidden>
<h2 id="nomBot"></h2>
<p class="small" id="plateforme"></p>

<label>Enregistrer une valeur statistique :</label>
<input id="valeur" type="number"
min="0.01" max="10000" step="0.01"
placeholder="Exemple : 25">

<button id="ajouter">ENREGISTRER</button>

<h2>STATISTIQUES</h2>
<p>Total : <span id="total">0</span></p>
<p>Moyenne : <span id="moyenne">0</span></p>
<p>Minimum : <span id="minimum">0</span></p>
<p>Maximum : <span id="maximum">0</span></p>

<h2>HISTORIQUE</h2>
<div id="historique">Aucune donnée.</div>

<button class="second" id="retour">RETOUR AUX 9 BOTS</button>
</div>

<script>
const bots = [
["Module 1","Statistiques"],
["Module 2","Statistiques"],
["Module 3","Statistiques"],
["Module 4","Statistiques"],
["Module 5","Statistiques"],
["Module 6","Statistiques"],
["Module 7","Statistiques"],
["Module 8","Statistiques"],
["Module 9","Statistiques"]
];

let actif = -1;

function creerListe(){
const zone = document.getElementById("bots");
zone.innerHTML = "";

bots.forEach((bot,i)=>{
const bouton = document.createElement("button");
bouton.textContent = "BOT "+(i+1)+" — "+bot[0];
bouton.onclick = ()=>ouvrirBot(i);
zone.appendChild(bouton);
});
}

function ouvrirBot(i){
actif=i;
document.getElementById("accueil").hidden=true;
document.getElementById("espaceBot").hidden=false;
document.getElementById("nomBot").textContent=bots[i][0];
document.getElementById("plateforme").textContent="Espace : "+bots[i][1];
afficher();
}

function lire(){
try{
return JSON.parse(localStorage.getItem("n9_bot_"+actif)||"[]");
}catch(e){
return [];
}
}

function afficher(){
const d=lire();
const total=d.length;

document.getElementById("total").textContent=total;
document.getElementById("moyenne").textContent=total?(d.reduce((a,b)=>a+b,0)/total).toFixed(2):"0";
document.getElementById("minimum").textContent=total?Math.min(...d):"0";
document.getElementById("maximum").textContent=total?Math.max(...d):"0";

const h=document.getElementById("historique");
h.textContent="";

if(!total){
h.textContent="Aucune donnée enregistrée.";
return;
}

d.slice().reverse().forEach((v,i)=>{
const ligne=document.createElement("p");
ligne.textContent=(i+1)+". "+v.toFixed(2);
h.appendChild(ligne);
});
}

document.getElementById("ajouter").onclick=()=>{
try {
if (typeof AndroidInternet === "undefined" || !AndroidInternet.disponible()) {
alert("Connexion Internet obligatoire pour enregistrer.");
return;
}
} catch(e) {
alert("Impossible de vérifier la connexion Internet.");
return;
}

const champ=document.getElementById("valeur");
const v=Number(champ.value);

if(!champ.value||!Number.isFinite(v)||v<=0||v>10000){
alert("Valeur invalide.");
return;
}

const d=lire();
d.push(v);
localStorage.setItem("n9_bot_"+actif,JSON.stringify(d));
champ.value="";
afficher();
};

document.getElementById("retour").onclick=()=>{
document.getElementById("espaceBot").hidden=true;
document.getElementById("accueil").hidden=false;
actif=-1;
};

creerListe();
</script>

</main>
</body>
</html>
